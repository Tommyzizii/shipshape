spring:
  mvc:
    problemdetails:
      enabled: true
  
  application:
    name: shipshape
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:shipshape}
    username: ${POSTGRES_USER:shipshape}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate: # Hibernate just check the schema but never change it
      ddl-auto: validate
    open-in-view: false
  
server:
  servlet:
    session:
      cookie: # JavaScript cannot read the session cookie; it is not sent on cross-site POSTs
        http-only: true
        same-site: lax
        # secure: true belongs in production (HTTPS only); local development runs over plain HTTP

management:
  endpoints:
    web:
      exposure:
        include: health
